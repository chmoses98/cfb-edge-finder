[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfb-edge-finder"
version = "0.1.0"
description = "Quantitative college-football market-pricing and betting-research system (foundation phase)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "requests>=2.31,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyarrow>=14",
]
# scripts/research_export.py reads data/research/v2/dataset.parquet (the research-data branch).
research = [
  "pyarrow>=14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfb_edge_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `contract/` holds the vendored Edge Finder app contract (edge_finder_contract); the app export
# and its tests import it from there rather than installing it.
pythonpath = ["contract"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
