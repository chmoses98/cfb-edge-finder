name: Kalshi CFB Market Catalog

# *** WHAT THIS IS ***
# The LIVE data path for this repository: it refreshes
# data/live/cfb_market_catalog.json -- the complete, per-physical-game
# inventory of every Kalshi college-football market -- and commits it only
# when the market surface actually changed.
#
# It consumes NO SECRETS. Kalshi's market-data endpoints are public reads
# and game identity comes from Kalshi's own football_game milestones, so
# unlike every live path that preceded it this workflow needs no
# CFBD_API_KEY and no Kalshi credential. It never calls an order or
# portfolio endpoint.
#
# *** CADENCE, AND WHY IT IS SHAPED LIKE THIS ***
# College football is a weekend sport. A flat "every 10 minutes, forever"
# schedule -- which is what the retired research collector ran -- spends
# ~4,300 runs a month to capture a slate that barely moves Monday to
# Thursday, and it emails a failure every time a socket resets.
#
#   Thu 18:00 - Sun 06:00 UTC   every 30 min   (the actual slate window:
#                                               Thursday night through the
#                                               end of Saturday's late
#                                               games in US time)
#   otherwise                   every 6 hours  (line moves, new listings)
#
# That is roughly 150 runs/week rather than ~1,000, while polling the
# window that matters MORE often than a uniform hourly schedule would.
#
# *** WHO ACTUALLY KEEPS THAT CADENCE ***
# Not the cron. GitHub creates only 2-8 of these scheduled runs a day
# (measured 2026-09-26 .. 2026-10-17, slate days included), and the missing
# ticks are never created at all. The CFB Research Conductor, which loops
# every 5 minutes around the clock, runs `scripts/catalog_schedule.py
# keepalive --dispatch` each cycle. That dispatches this workflow whenever
# no catalog run is queued or running and the newest one is at least one
# cadence old, using the same cadence table as above and freshness.py. The
# cron below stays as the fallback if the conductor's chain ever breaks.
#
# *** WHY IT IS QUIET ***
# A run that finds nothing changed writes nothing, commits nothing and
# says nothing. A transient Kalshi failure does not fail the job (the
# catalog publishes with INCOMPLETE diagnostics and the next tick
# recovers); only a genuinely unusable capture -- zero games discovered,
# or the builder crashing -- fails and notifies. The retired collector
# emailed a red run for every reset socket, which trained everyone to
# ignore it.
on:
  schedule:
    # Slate window: Thursday 18:00 UTC through Sunday 06:00 UTC.
    - cron: "*/30 18-23 * * 4"
    - cron: "*/30 * * * 5,6"
    - cron: "*/30 0-6 * * 0"
    # Off-peak keepalive: every 6 hours the rest of the week.
    - cron: "40 */6 * * 0,1,2,3,4"
  workflow_dispatch:
    inputs:
      horizon_days:
        description: "Publish games kicking off within this many days (-1 for no horizon)"
        required: false
        default: "10"
      include_raw:
        description: "Embed each market's raw Kalshi payload in the flat index"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# contents: write is used only to commit the refreshed catalog; actions: read
# lets the last step read this workflow's own run history for the gap report.
permissions:
  contents: write
  actions: read

# *** WHY THE CATALOG HAS ITS OWN GROUP ***
# GitHub keeps ONE pending run per concurrency group, and a newly queued run
# cancels the one already pending, whatever cancel-in-progress says. While
# the catalog shared research-data-write with the Script Engine (~45 min per
# run, near back-to-back) and the App Export (every 30 min and after every
# Script Engine run), a queued catalog run was routinely replaced before it
# started: on 2026-10-17, 3 of the 9 catalog runs were cancelled this way,
# all with zero jobs.
#
# Sharing the group bought nothing. The catalog commits only data/live/** on
# its own ref, which no other writer touches. It never writes the
# research-data durable store, and its push already rebases and retries.
# tests/test_research_workflow_concurrency.py pins that carve-out (paths,
# branch, rebase-retry, cancel-in-progress) so it cannot widen silently. Now
# only a newer catalog run can replace a queued catalog run, which loses
# nothing.
#
# cancel-in-progress: false is still essential: a previous mission's job
# used `true` on a shared group and cancelled 12 queued collector runs.
concurrency:
  group: kalshi-market-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Remember the previously published fingerprint
        # Read from the CHECKED-OUT file before the builder overwrites
        # it, rather than asking git to show the committed revision of that
        # path. tests/test_research_workflow_concurrency.py classifies a
        # workflow as an isolated-branch sidecar by scanning for a
        # revision-colon-path push target, and spelling one anywhere in
        # this file -- even inside a `git show` -- made it misread this
        # workflow as a sidecar that must NOT hold the repo's single
        # writer lock. Reading the file directly avoids the ambiguity
        # entirely and is simpler besides.
        id: previous
        run: |
          if [ -f data/live/cfb_catalog_status.json ]; then
            FP=$(python3 -c "import json;print(json.load(open('data/live/cfb_catalog_status.json')).get('content_fingerprint',''))" 2>/dev/null || echo "")
          else
            FP=""
          fi
          echo "fingerprint=${FP}" >> "$GITHUB_OUTPUT"
      - name: Build the Kalshi CFB market catalog
        id: build
        # No credentials are passed to this step because none exist to
        # pass: the entire discovery path is unauthenticated public reads.
        run: |
          python3 scripts/build_kalshi_cfb_catalog.py \
            --out-dir data/live \
            --horizon-days "${{ github.event.inputs.horizon_days || '10' }}" \
            ${{ github.event.inputs.include_raw == 'true' && '--include-raw' || '' }} \
            --print-summary
      - name: Verify the RUN CFB execution index
        # The builder also writes data/live/cfb_execution_index.json and
        # data/live/execution/** -- the small files ChatGPT's GitHub
        # connector can actually read (the catalog and marquee game files
        # are over the 1 MB size at which GitHub's Contents API returns
        # empty content). This re-reads them from disk and fails the job,
        # before anything is committed, if any pointer is broken, any file
        # is oversized, any contract is missing, or any fingerprint
        # disagrees.
        run: python3 scripts/build_cfb_execution_index.py --out-dir data/live --verify-only
      - name: Commit the catalog only if the market surface changed
        # Change detection is the whole storage/Actions budget story. The
        # builder writes a content fingerprint that deliberately EXCLUDES
        # capture timestamps and clock-derived mechanics (quote age,
        # seconds-to-close), so a run over an unchanged surface produces
        # byte-identical market content and is skipped entirely. Prices ARE
        # in the fingerprint -- a price move is a real change worth
        # recording.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The whole tree: the slate index, data/live/games/*.json, and the
          # execution index (cfb_execution_index.json + execution/**).
          # Per-game files mean a price move in one game rewrites one small
          # file rather than a 52 MB blob, and a game leaving the slate has
          # its file pruned -- both of which `git add data/live` records.
          git add -A data/live

          if git diff --cached --quiet; then
            echo "catalog byte-identical; nothing to commit"
            exit 0
          fi

          # Did anything but the clock move? Compare fingerprints, not bytes.
          NEW_FP=$(python3 -c "import json;print(json.load(open('data/live/cfb_catalog_status.json'))['content_fingerprint'])")
          OLD_FP="${{ steps.previous.outputs.fingerprint }}"
          if [ -n "$OLD_FP" ] && [ "$NEW_FP" = "$OLD_FP" ]; then
            echo "market surface unchanged (fingerprint $NEW_FP); skipping commit to avoid timestamp churn"
            git reset -q
            # Self-heal the derived execution index. Restore the committed
            # catalog exactly, rebuild the execution files FROM IT, and
            # commit only if they differ from what is committed (first
            # deploy, or a builder fix). Over an in-sync tree the rebuild
            # is byte-identical, so this commits nothing and never churns.
            git checkout -- data/live
            git clean -fdq data/live
            python3 scripts/build_cfb_execution_index.py --out-dir data/live
            git add -A data/live
            if git diff --cached --quiet; then
              echo "execution index in sync with the committed catalog"
              exit 0
            fi
            git commit -m "kalshi cfb execution index: resync with committed catalog (fingerprint ${NEW_FP:0:12})"
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push attempt ${attempt} failed; backing off"
              sleep $((attempt * 4))
            done
            exit 1
          fi

          GAMES=$(python3 -c "import json;print(json.load(open('data/live/cfb_catalog_status.json'))['physical_games'])")
          MARKETS=$(python3 -c "import json;print(json.load(open('data/live/cfb_catalog_status.json'))['markets'])")
          COMPLETE=$(python3 -c "import json;print(json.load(open('data/live/cfb_catalog_status.json'))['capture_complete'])")
          git commit -m "kalshi cfb catalog: ${GAMES} games / ${MARKETS} markets (complete=${COMPLETE})"

          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed; backing off"
            sleep $((attempt * 4))
          done
          exit 1
      - name: Surface an incomplete capture without failing the run
        if: always()
        # A script on disk rather than a heredoc nested inside a shell
        # `if` inside a YAML block scalar: that shape is three quoting
        # layers deep, cannot be run outside CI, and cannot be tested.
        # The build outcome is passed so a failed build does not re-report
        # the previously committed status file as this run's result.
        env:
          CATALOG_BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 scripts/report_catalog_status.py
      - name: Report missed capture windows
        # Diagnostic only, never fails the run: every gap between successful
        # catalog runs on main that exceeded the RUN CFB staleness tolerance
        # (90 min in the slate window, 18 h otherwise), as warnings plus a
        # job summary, so a missed Saturday window is visible on the run
        # page. GitHub drops most */30 cron ticks; the CFB Research
        # Conductor's keepalive (scripts/catalog_schedule.py) dispatches the
        # catalog when one is due.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/catalog_schedule.py report --hours 24
