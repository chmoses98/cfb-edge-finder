name: Fit Margin Correction Artifact Live (manual)

# Manual-only, mirrors backtest-cfb-baseline-live.yml's rationale exactly:
# lets a human deliberately spend a handful of real, rate-limited CFBD API
# calls to (re)fit the frozen Milestone C.2 Part 3 margin-correction
# artifact (cfb_edge_finder.modeling.margin_correction_artifact) that the
# live single-game research CLI (scripts/build_cfb_baseline.py) applies.
# This workflow only PRINTS the fitted coefficients -- a human then
# freezes them into that module in a follow-up commit, the same two-step
# pattern every other C.2 hyperparameter in this repo was selected with.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Space-separated seasons to fit against, e.g. '2022 2023 2024 2025'"
        required: true
        default: "2022 2023 2024 2025"
      n_simulations:
        description: "Monte Carlo simulations per game projection"
        required: false
        default: "6000"

# Read-only: this workflow only calls out to CFBD and prints the fitted
# coefficients. It never commits, pushes, or writes anything back to this
# repository.
permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Fit margin-correction artifact
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python3 scripts/fit_margin_correction_artifact.py \
            --seasons ${{ github.event.inputs.seasons }} \
            --mode live \
            --n-simulations ${{ github.event.inputs.n_simulations }}
