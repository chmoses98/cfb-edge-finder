name: Research Settlement

# Runs periodically after games are expected to finish. Every 6 hours
# covers CFB's Saturday-heavy, but not Saturday-only, schedule
# (Tuesday/Wednesday MACtion, occasional weekday bowls) without needing a
# separate per-day-of-week schedule.
#
# *** WHY THIS DOES NOT NEED THE COLLECTOR'S 10-MINUTE CADENCE ***
# Prospective capture is racing a market: a closing line exists for
# fourteen minutes and is gone forever. Settlement is racing nothing. A
# final score does not expire, and an observation settled six hours after
# kickoff carries exactly the same research value as one settled six
# minutes after. Matching the collector's cadence would multiply CFBD and
# Kalshi load 36x to make a permanent fact available slightly sooner.
#
# Both steps are idempotent, so running more often than strictly
# necessary is safe -- just wasted CI minutes and API budget. 6h is a
# deliberate, documented choice rather than a tight one.
#
# Two steps run in sequence:
#   1. research_settle.py     -- MARKET-level outcome facts (one per
#                                game/ticker), unchanged.
#   2. research_attribute.py  -- OBSERVATION-level attribution (one per
#                                captured checkpoint) with research-unit
#                                economics and CLOSING linkage.
# The second depends on the first only through the corpus, not through
# process state, so a failure in one does not silently corrupt the other.
#
# Shares the `research-data-write` concurrency group with every other
# corpus writer, so settlement can never interleave with a capture run.

#
# *** HIBERNATED 2026-09-17 -- MARKET-DISCOVERY PIVOT ***
# The scheduled trigger below is commented out, NOT deleted, and every
# script, library and datum this workflow uses is untouched. Re-enable by
# uncommenting the `schedule:` block; `workflow_dispatch` still works
# today, so a human can run this at any time without any change at all.
#
# WHY: this workflow exists to feed the college-football projection model
# (CFBD history fetch -> ratings/priors -> score model -> prospective
# capture). That model is no longer trusted for wagering decisions and has
# been removed from the live path; the live path is now
# .github/workflows/kalshi-market-catalog.yml, which consumes no secret and
# produces no projection. Leaving this on a 6-hourly schedule spends
# Actions minutes and a CFBD quota on a model nothing reads.
#
# See docs/MODEL_RETIREMENT_2026.md for the full retirement plan, what is
# preserved, and the one genuinely irreversible consequence (closing lines
# stop accruing while this is hibernated).
on:
#   schedule:
#     - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to settle"
        required: false
        default: "2026"
      no_push:
        required: false
        default: "false"

concurrency:
  group: research-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Configure git identity for durable-store commits
        run: |
          git config user.name "research-settlement-bot"
          git config user.email "research-settlement-bot@users.noreply.github.com"
      # A --no-push dry run never calls ensure_branch_checked_out, so it
      # needs the durable data (observation ledger + schedule identity
      # for the fail-closed ESPN fallback) checked out separately --
      # otherwise it would "validate" against an empty corpus.
      - name: Check out durable research-data for dry-run reads
        if: ${{ github.event.inputs.no_push == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: research-data-checkout

      - name: Settle markets (outcome facts)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/research_settle.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            ${{ github.event.inputs.no_push == 'true' && '--no-push --data-repo-dir research-data-checkout' || '' }}

      # *** WHY THE CODE IS RE-CHECKED-OUT HERE ***
      # The previous step's `ensure_branch_checked_out` switches the
      # working tree to the `research-data` ORPHAN branch, which holds
      # data and no code. A second Python step therefore cannot find its
      # own script -- a live run failed exactly that way
      # (job 98627603145). The already-running interpreter in step 1 is
      # unaffected because its module was loaded before the switch; a NEW
      # process is not. Re-checking out the workflow ref restores
      # scripts/ and src/, and the attribution script then does its own
      # `ensure_branch_checked_out` exactly as the first one did.
      - name: Restore code checkout after the durable-branch switch
        uses: actions/checkout@v4

      - name: Reinstall package after checkout
        run: pip install -e ".[dev]"

      - name: Configure git identity (restored checkout)
        run: |
          git config user.name "research-settlement-bot"
          git config user.email "research-settlement-bot@users.noreply.github.com"

      # The restore step's `git clean -ffdx` deletes the nested dry-run
      # data checkout (observed live: run 33331025881 attributed against
      # an empty corpus, "observations_scanned": 0), so it must be
      # checked out AGAIN for the attribution step's dry-run reads.
      - name: Re-check out durable research-data for dry-run reads
        if: ${{ github.event.inputs.no_push == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: research-data-checkout

      # Per-observation attribution: resolves each captured checkpoint to
      # its market's outcome with its own entry price, fee, hypothetical
      # research-unit economics and CLOSING linkage. Exits non-zero on a
      # settlement that disagrees with Kalshi's own finalized result.
      - name: Attribute observations (per-checkpoint settlement)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/research_attribute.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --trigger-type "${{ github.event_name }}" \
            ${{ github.event.inputs.no_push == 'true' && '--no-push --data-repo-dir research-data-checkout' || '' }}
