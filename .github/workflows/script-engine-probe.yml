name: Script engine probe (dev branch only)

# Throwaway: captures real ESPN CFB payloads as test fixtures so the script
# engine's parser is written against captured payloads rather than memory.
# Runs only on the development branch and is removed before review.
on:
  push:
    branches: [claude/peaceful-meitner-n7d125]
    paths:
      - scripts/probes/**
      - .github/workflows/script-engine-probe.yml

permissions:
  contents: write

concurrency:
  group: script-engine-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/probes/espn_summary_probe.py 20261003
      - name: Commit fixtures to the development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/espn
          git diff --cached --quiet && exit 0
          git commit -m "fixtures: real ESPN CFB payloads captured by the script-engine probe"
          git push origin HEAD:${{ github.ref_name }}
