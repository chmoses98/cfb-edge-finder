name: CI

on:
  push:
    branches: [main]
  pull_request:

# Explicit least-privilege default: CI only checks out code and runs
# lint/tests, never pushes, comments, or writes anything back. No job
# below needs more than this, so nothing overrides it per-job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        # `scripts` included deliberately: the scheduled scanner and the
        # benchmark harness live there, not under src/, so leaving it out
        # meant the most operationally important entry point in the repo
        # was the one file CI never linted.
        run: ruff check src tests scripts
      - name: Test (pytest)
        run: pytest -v
      # The automated half of the post-GH001 size guard. The write path
      # rolls a shard over at 45 MB and the durable store refuses to push
      # above 90 MB, but an artifact that is NOT sharded (the
      # football-state document, a v2 parquet) could still drift toward
      # GitHub's 100 MiB limit between pushes. This points the same check
      # at the live durable corpus so that drift is caught on a schedule
      # rather than by a rejected collection run.
      #
      # Read-only: fetches the data branch shallowly into a temp dir and
      # never writes to it. `--strict` because on the durable branch a
      # blob over the shard target is already a defect worth failing on --
      # except a pre-sharding `{season}.jsonl`, which
      # `--allow-legacy-monolith` reports as MIGRATION_PENDING instead.
      # Without that, this step would be red on every pull request until
      # the corpus was migrated, INCLUDING the pull request that adds the
      # migration, which cannot run before it merges. It retires itself:
      # once the corpus is sharded there is no legacy monolith left and
      # any oversize blob fails normally.
      - name: Durable-store blob size guard
        run: |
          set -euo pipefail
          CORPUS="$RUNNER_TEMP/durable"
          mkdir -p "$CORPUS"
          if git fetch origin research-data --depth=1 2>/dev/null; then
            git ls-tree -r --name-only origin/research-data -- data/research \
              | while IFS= read -r tracked; do
                  [ -n "$tracked" ] || continue
                  mkdir -p "$CORPUS/$(dirname "$tracked")"
                  git show "origin/research-data:$tracked" > "$CORPUS/$tracked"
                done || true
            python scripts/check_research_blob_sizes.py \
              --data-repo-dir "$CORPUS" --strict --allow-legacy-monolith
          else
            echo "(research-data branch not reachable; nothing to size-check)"
          fi
