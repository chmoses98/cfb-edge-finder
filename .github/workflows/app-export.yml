name: App Export

# *** WHAT THIS IS ***
# Publishes the Edge Finder app bundle (contract edge_finder.app.v1, see
# docs/APP_EXPORT.md) to app/latest on main. It is a pure read-and-reshape
# of two things this repository already produces:
#
#   data/live/cfb_market_catalog.json + data/live/games/   (the live catalog)
#   the accounting-data branch                               (wagers, settlements)
#
# It consumes NO SECRETS: the catalog is committed, and the ledger branch
# is fetched read-only with the workflow's own token. It never calls Kalshi.
#
# *** WHY IT IS A SEPARATE WORKFLOW ***
# The catalog workflow commits only when the market surface's fingerprint
# changed, so an export step inside it would never run on a quiet tick and
# would never see a ledger change (a settlement lands on accounting-data
# without touching the catalog at all). This workflow therefore runs after
# every catalog run AND on its own 30-minute clock, and decides for itself
# whether anything worth committing changed (`--skip-unchanged`).
#
# *** WHY IT IS QUIET ***
# The exporter compares the new bundle's state key (catalog fingerprint,
# ledger digest, health and event statuses) with the one already committed
# and publishes nothing when they match, so a quiet half hour commits
# nothing. On a build failure it rewrites ONLY app/latest/health.json
# (export_failed=true, payload left as last-known-good), that file IS
# committed so the app can see the failure, and the job is red.
#
# *** WHY IT ALSO FOLLOWS THE SCRIPT ENGINE ***
# The research explorer embeds the CFB Script Engine payloads (data/scripting/live/sift) into
# event_research.extensions.script_engine. A successful Script Engine run on main therefore starts
# this export, and the explorer rebuilds at once, whatever its age, whenever the payload set's content
# fingerprint differs from the one recorded with the published explorer (explorer/sources.json; see
# docs/APP_EXPORT.md "Refresh cadence"). Only a successful main run counts: a feature-branch, failed
# or forked run never starts the job (the `if:` below), and the checkout is always main, so no branch
# but main can certify what the explorer embeds.
#
# *** FORCING A REBUILD ***
# workflow_dispatch with force_explorer=true rebuilds the explorer now, bypassing only its 180-minute
# age throttle; the v1 export, every validation and the atomic publish run exactly as on the clock.
on:
  workflow_run:
    workflows: ["Kalshi CFB Market Catalog", "CFB Script Engine"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_explorer:
        description: "Rebuild the research explorer now (bypasses only its 180-minute age throttle)"
        type: boolean
        default: false

permissions:
  contents: write

# Shares the single-writer lock with the catalog: both commit to main with
# a rebase-retry push, and queuing (never cancelling) is the only safe
# setting for a writer -- see tests/test_research_workflow_concurrency.py.
concurrency:
  group: research-data-write
  cancel-in-progress: false

jobs:
  export:
    # A Script Engine completion starts the export only when it is a successful run on main in this
    # repository; the catalog trigger, the clock and manual dispatch are unchanged.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.name != 'CFB Script Engine'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Owner opt-in for CFBD-derived explorer values (see docs/APP_EXPORT.md "Research explorer"). Off until
      # the CFBD redistribution licence question is resolved; "true" fetches research-data and passes --include-cfbd.
      INCLUDE_CFBD: "false"
      # "true" only for a manual dispatch with force_explorer ticked; every other trigger keeps the throttle.
      FORCE_EXPLORER: ${{ github.event_name == 'workflow_dispatch' && inputs.force_explorer == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        # [research] adds pyarrow, which the explorer needs for the v2 research dataset (CFBD opt-in only).
        run: pip install -e ".[research]"
      - name: Fetch the accounting ledger (read-only)
        run: |
          set -euo pipefail
          ACCT="$RUNNER_TEMP/acct"
          mkdir -p "$ACCT"
          if git fetch --depth=1 origin accounting-data 2>/dev/null; then
            git archive origin/accounting-data | tar -x -C "$ACCT"
            echo "accounting-data fetched into $ACCT"
          else
            echo "::warning::accounting-data branch not reachable; wagers and settlements will export empty"
          fi
      - name: Build the app export
        run: |
          python scripts/app_export.py \
            --out app/latest \
            --accounting-dir "$RUNNER_TEMP/acct" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --skip-unchanged
      - name: Is a research explorer rebuild due?
        # The explorer is rebuilt when it is missing, the v1 events changed, the Script Engine publication
        # it embeds changed (content fingerprint), or it is older than 3 hours, so the 30-minute cron does
        # not rewrite ~1,300 files each tick. force_explorer makes it due now.
        id: explorer_due
        continue-on-error: true
        run: |
          FORCE_ARGS=()
          if [ "$FORCE_EXPLORER" = "true" ]; then FORCE_ARGS=(--force); fi
          python scripts/research_export.py --out app/latest --min-interval-minutes 180 --check-due \
            "${FORCE_ARGS[@]}" >> "$GITHUB_OUTPUT"
      - name: Deepen the catalog history (market history, read-only)
        # Market history is rebuilt from the catalog's git history on every rebuild, whatever the cadence,
        # and the checkout is depth 1. The catalog lists games about two weeks ahead and the exporter stops
        # at the first commit that lists none of them, so 18 days is enough. On failure market history
        # degrades to the current snapshot and the explorer says so.
        if: steps.explorer_due.outputs.due == 'true'
        run: |
          SINCE=$(date -u -d '18 days ago' +%Y-%m-%dT%H:%M:%SZ)
          git fetch --shallow-since="$SINCE" origin main 2>/dev/null \
            || echo "::warning::catalog history not deepened; market history will hold the current snapshot only"
      - name: Fetch the research-data files (read-only, owner opt-in only)
        # CFBD-derived values are published only when the owner opts in (INCLUDE_CFBD, --include-cfbd):
        # the CFBD redistribution licence is unresolved. If the fetch fails the explorer still publishes
        # markets, market history, wagers and capabilities; CFBD-backed capabilities read UNAVAILABLE.
        if: env.INCLUDE_CFBD == 'true' && steps.explorer_due.outputs.due == 'true'
        run: |
          RES="$RUNNER_TEMP/research"
          mkdir -p "$RES"
          if git fetch --depth=1 origin research-data 2>/dev/null \
             && git archive origin/research-data -- data/research_cache/v2 data/research/v2/dataset.parquet \
                  data/research/v2/dataset.parquet.meta.json | tar -x -C "$RES"; then
            echo "research-data files extracted into $RES"
          else
            rm -rf "$RES" && mkdir -p "$RES"
            echo "::warning::research-data branch not available; CFBD-backed explorer capabilities will be UNAVAILABLE"
          fi
      - name: Build the research explorer (app/latest/explorer)
        # Its own step AFTER the v1 export: a research failure can never block the v1 payload.
        # continue-on-error lets the commit step still publish app/latest; the last step turns the job red.
        # Runs when a rebuild is due (or the due check itself failed); the age only grows between the two
        # steps, so its own --min-interval-minutes check agrees with the one above.
        if: steps.explorer_due.outputs.due != 'false'
        id: research_export
        continue-on-error: true
        run: |
          set -o pipefail
          CFBD_ARGS=()
          if [ "$INCLUDE_CFBD" = "true" ]; then
            CFBD_ARGS=(--include-cfbd --research-root "$RUNNER_TEMP/research")
          fi
          FORCE_ARGS=()
          if [ "$FORCE_EXPLORER" = "true" ]; then FORCE_ARGS=(--force); fi
          python scripts/research_export.py \
            --out app/latest \
            --data-root data/live \
            --min-interval-minutes 180 \
            "${CFBD_ARGS[@]}" "${FORCE_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/research_export.log"
          {
            echo "### Research explorer"
            echo "due: ${{ steps.explorer_due.outputs.reason }}"
            echo '```'
            tail -c 6000 "$RUNNER_TEMP/research_export.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Research explorer not due
        if: steps.explorer_due.outputs.due == 'false'
        run: |
          echo "research explorer not rebuilt: ${{ steps.explorer_due.outputs.reason }}"
          echo "### Research explorer: not rebuilt (${{ steps.explorer_due.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit app/latest only if changed
        # always(): a failed build leaves a rewritten health.json behind on
        # purpose, and that is the one file the app most needs to see. The
        # job stays red because the build step already failed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/latest
          if git diff --cached --quiet; then
            echo "app export byte-identical; nothing to commit"
            exit 0
          fi
          SUMMARY=$(python3 -c "import json,sys;m=json.load(open('app/latest/manifest.json')) if __import__('os').path.exists('app/latest/manifest.json') else {};c=m.get('counts',{});print(f\"{c.get('events',0)} events / {c.get('markets',0)} markets / {c.get('wagers',0)} wagers\")" 2>/dev/null || echo "health only")
          git commit -m "app export: ${SUMMARY}"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed; backing off"
            sleep $((attempt * 4))
          done
          exit 1
      - name: Fail the job if the research explorer failed
        # The v1 payload (and its health.json) was committed above; this only makes the failure visible.
        if: steps.research_export.outcome == 'failure'
        run: |
          echo "::error::research explorer export failed; app/latest/explorer was left as last published"
          exit 1
