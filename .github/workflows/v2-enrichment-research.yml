# RESEARCH-ONLY (V2 data-enrichment mission). Read-only against every
# external source; never touches the production collector, the
# research-data branch, or the 0.5.0 model. Spends zero metered CFBD
# calls in probe mode (/info is unmetered).
name: V2 Enrichment Research (read-only)

on:
  push:
    branches: [claude/cfb-model-v2-research-krupoc]
    paths: [scripts/v2_enrichment_probe.py, .github/workflows/v2-enrichment-research.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (default) | weather -- fetch Open-Meteo kickoff weather for every V2 game and push to research-data"
        required: false
        default: "probe"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas pyarrow
      - name: Source reachability + unmetered quota probe
        if: ${{ github.event.inputs.mode != 'weather' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/v2_enrichment_probe.py

  weather:
    if: ${{ github.event.inputs.mode == 'weather' }}
    runs-on: ubuntu-latest
    # Writes ONLY to the research-data-v2enrich orphan branch (never main and
    # never research-data). It has its OWN concurrency group: it must never
    # share `research-data-write` with the collector, because GitHub keeps a
    # single pending run per group and a long fetch here would cancel queued
    # collector runs (this happened once on 2026-09-02 and is the reason for
    # the separate branch and group).
    permissions:
      contents: write
    concurrency:
      group: v2-enrich-weather-write-${{ matrix.product }}
      cancel-in-progress: false
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        product: [archive, hforecast, prevrun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas pyarrow
      - name: Fetch Open-Meteo kickoff weather (free, keyless, zero CFBD calls)
        run: |
          python scripts/v2_fetch_weather.py --games data/research_inputs/v2_games_for_weather.csv \
            --products ${{ matrix.product }} --out-dir "$RUNNER_TEMP/weather" --max-minutes 290
          ls -la "$RUNNER_TEMP/weather"
      - name: Push to research-data-v2enrich (isolated orphan branch)
        if: always()
        run: |
          test -f "$RUNNER_TEMP/weather/weather_${{ matrix.product }}.parquet" || { echo "nothing fetched"; exit 0; }
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/rd
          if git fetch origin research-data-v2enrich --depth=1 2>/dev/null; then
            git worktree add /tmp/rd origin/research-data-v2enrich --detach
          else
            mkdir -p /tmp/rd && git -C /tmp/rd init -q && git -C /tmp/rd checkout -q --orphan research-data-v2enrich
            git -C /tmp/rd config user.name "github-actions[bot]"
            git -C /tmp/rd config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          mkdir -p /tmp/rd/data/research_cache/v2_enrich/weather
          cp "$RUNNER_TEMP"/weather/weather_${{ matrix.product }}.parquet /tmp/rd/data/research_cache/v2_enrich/weather/
          cp "$RUNNER_TEMP"/weather/manifest.json /tmp/rd/data/research_cache/v2_enrich/weather/manifest_${{ matrix.product }}.json
          cd /tmp/rd && git add data/research_cache/v2_enrich
          git diff --cached --quiet && { echo unchanged; exit 0; }
          git commit -q -m "V2 enrichment cache: Open-Meteo kickoff weather (${{ matrix.product }}) for V2 games

          Free, keyless, read-only fetch on a GitHub-hosted runner by
          .github/workflows/v2-enrichment-research.yml (mode=weather).
          Zero CFBD calls. See manifest_${{ matrix.product }}.json for timing classes."
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4; do
            git push origin HEAD:research-data-v2enrich && exit 0
            git fetch origin research-data-v2enrich --depth=1 && git rebase origin/research-data-v2enrich || git rebase --abort
            sleep $((i * 5))
          done
          exit 1
