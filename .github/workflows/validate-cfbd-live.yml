name: Validate CFBD Live (manual)

# Manual-only. No schedule/cron trigger -- this workflow exists to let a
# human deliberately spend a real, rate-limited CFBD API call to validate
# schema/team-universe assumptions, not to run automatically or repeatedly.
on:
  workflow_dispatch:

# Read-only: this workflow only calls out to CFBD and prints diagnostics.
# It never commits, pushes, or writes anything back to this repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run live CFBD validation
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        # scripts/validate_cfbd_live.py never prints the API key or an
        # Authorization header, and exits non-zero on auth/HTTP/schema
        # failure so this step fails loudly (red X) rather than silently
        # swallowing an error.
        run: python3 scripts/validate_cfbd_live.py
