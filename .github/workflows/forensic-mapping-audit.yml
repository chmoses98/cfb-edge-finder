# TEMPORARY forensic workflow for the 2026-09-01 mapping_failure_rate_high
# investigation. Read-only against Kalshi and the durable research-data
# branch; makes ZERO CFBD requests (schedule/teams come from the cached
# football_state artifact). Removed once the investigation closes.
name: Forensic Mapping Audit (read-only)

on:
  push:
    branches: [claude/cfb-mapping-failures-forensic-p34r7j]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Production mapping replay (zero CFBD requests)
        run: |
          python scripts/audit_production_mapping_replay.py \
            --schedule-season 2026 \
            --json forensic_replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forensic-replay
          path: forensic_replay.json
          retention-days: 7
