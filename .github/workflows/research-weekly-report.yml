name: Research Weekly Report

# Milestone E, Part I/P. Builds the weekly and season-cumulative research
# reports.
#
# *** SCHEDULE DISABLED -- QUIET HIBERNATION (2026-09-06) ***
# Was `cron: "0 9 * * 1"` (Mondays 09:00 UTC). This workflow REPORTS on
# prospective evidence; it does not collect any. Active model development
# has stopped, so nobody is reading a weekly report as it lands, and a
# recurring scheduled job that nobody reads is purely a weekly chance to
# email a red run about a report that could have been regenerated on
# demand at any time.
#
# Nothing is lost by disabling the schedule: the reports are pure
# functions of the durable research corpus, which the collector and
# settlement workflows keep filling. An end-of-season review dispatches
# this manually and gets a report built from a strictly more complete
# corpus than any weekly run could have produced.
#
# The workflow, its code, and every report it has already committed are
# deliberately untouched. Re-enable by restoring the two `schedule` lines.

on:
  workflow_dispatch:
    inputs:
      season:
        required: false
        default: "2026"
      week_label:
        description: "e.g. wk01 -- required for the weekly report"
        required: false
        default: "wk01"
      no_push:
        required: false
        default: "false"

concurrency:
  group: research-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Configure git identity for durable-store commits
        run: |
          git config user.name "research-report-bot"
          git config user.email "research-report-bot@users.noreply.github.com"
      - name: Build weekly report
        run: |
          python scripts/research_weekly_report.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --week-label "${{ github.event.inputs.week_label || 'wk01' }}" \
            ${{ github.event.inputs.no_push == 'true' && '--no-push' || '' }}
      - name: Build season cumulative report
        run: |
          python scripts/research_season_report.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            ${{ github.event.inputs.no_push == 'true' && '--no-push' || '' }}
