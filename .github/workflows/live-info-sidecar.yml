# LIVE INFORMATION SIDECAR -- research-only.
#
# *** ISOLATION REVIEW BEFORE ENABLING ON MAIN (mission section 15) ***
#   concurrency group  `research-sidecar-write` -- NOT the collector's
#                      `research-data-write`, so it can never queue
#                      against Research Capture. (A previous mission's
#                      weather job DID share that group and cancelled 12
#                      queued collector runs; that is the failure this
#                      separation exists to prevent.)
#   storage            the `research-sidecar` ORPHAN branch only. It
#                      never writes main, research-data, the observation
#                      ledger, the V2 shadow ledger, or any artifact any
#                      model reads.
#   model impact       none. Nothing here is an input to 0.5.0 or to the
#                      frozen V2 artifact -- this slate's V2 predictions
#                      were fixed before this data existed. It is being
#                      collected PROSPECTIVELY for future research only.
#   cost               keyless public sources; ZERO CFBD calls.
#   failure            fails independently; a red sidecar run costs
#                      nothing but the sidecar. Captures pregame forecasts,
# posted odds and injury lists for upcoming games and appends them,
# timestamped, to the ISOLATED `research-sidecar` orphan branch.
# Never touches main, research-data, the collector, or the 0.5.0 model.
# Zero CFBD calls. Fails independently. (A cron schedule only fires once
# this file exists on the default branch; until then dispatch manually.)
name: Live Info Sidecar (research-only)

# KEPT ON SCHEDULE under quiet hibernation (2026-09-06): this is
# prospective live-info evidence -- pregame forecasts, posted odds and
# injury lists that only exist before kickoff and cannot be reconstructed
# afterwards. It is keyless, spends zero CFBD calls, writes only the
# isolated `research-sidecar` orphan branch, and is already quiet by
# construction: scripts/live_info_sidecar.py records an unavailable source
# as a data row (status code / parse error) and returns 0, so a flaky
# provider becomes evidence rather than an incident. Only a genuine write
# or push failure can make it red -- exactly the case worth mail.
#
# The bootstrap `push:` trigger is removed: its feature branch merged as
# PR #38 and is no longer pushed, so it could only ever fire by accident.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: research-sidecar-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas pyarrow
      - name: Capture upcoming-game live information (append-only)
        run: |
          set -euo pipefail
          git fetch origin research-sidecar --depth=1 2>/dev/null && \
            git worktree add /tmp/rs origin/research-sidecar --detach || \
            { mkdir -p /tmp/rs && cd /tmp/rs && git init -q && git checkout -q --orphan research-sidecar && cd -; }
          mkdir -p /tmp/rs/data/research/live_sidecar
          python scripts/live_info_sidecar.py --games data/research_inputs/v2_games_for_weather.csv \
            --out-dir /tmp/rs/data/research/live_sidecar
      - name: Push to research-sidecar (isolated orphan branch)
        run: |
          set -euo pipefail
          cd /tmp/rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/live_sidecar
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "live sidecar capture $(date -u +%Y-%m-%dT%H:%M:%SZ) (research-only, append-only)"
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:research-sidecar
