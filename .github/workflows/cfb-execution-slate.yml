name: CFB Execution Slate

# *** WHAT THIS IS ***
# The one action to run before a slate. It refreshes the live Kalshi CFB
# catalog, compacts it into per-game execution packets, shards those by
# kickoff window, reconciles every count, and uploads the result as a
# build artifact.
#
# *** IT WRITES NOTHING TO THE REPOSITORY ***
# `permissions: contents: read`, and the output leaves as an uploaded
# artifact rather than a commit. That is deliberate: the execution slate
# is an operational working file regenerated many times on a Saturday,
# and committing each regeneration would churn the repo for no archival
# value -- the catalog it is derived from is already committed by the
# Kalshi CFB Market Catalog workflow. Writing nothing also keeps this
# workflow out of the durable-store writer lock entirely, so it can never
# queue behind or cancel a collector run.
#
# *** IT CONSUMES NO SECRETS ***
# Kalshi's market-data endpoints are public reads and game identity comes
# from Kalshi's own football_game milestones. No order or portfolio
# endpoint is reachable from any code this workflow runs. The factual
# context collector is keyless too -- ESPN's public scoreboard and core
# endpoints, and Open-Meteo. CFBD is optional and is NOT consulted here.
#
# *** WHY IT IS ALSO SCHEDULED, AND WHY THE CADENCE IS SMALL ***
# Three runs on a Saturday and one the evening before, and nothing on the
# days nobody bets. It is a READ-ONLY, secret-free, ~6-minute job that
# writes no branch, so the cost of a scheduled run is Actions minutes and
# nothing else -- and what it buys is that a broken slate is discovered
# on a Saturday MORNING rather than forty minutes before a kickoff, with
# the factual context already collected.
#
# It is deliberately NOT every thirty minutes. The catalog workflow
# already refreshes prices at that cadence; a slate is only worth
# rebuilding when a human is about to read one, and a dispatch is always
# available for exactly that.
on:
  schedule:
    # 11:00 and 15:00 UTC Saturday: before the noon and the 3.30 Eastern
    # windows. 22:00 UTC Saturday for the evening slate. 23:00 UTC Friday
    # for a Saturday-morning reader.
    - cron: "0 11,15,22 * * 6"
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      date:
        description: "Local slate date (YYYY-MM-DD), or 'all' for the whole catalog horizon. Blank = today."
        required: false
        default: ""
      refresh:
        description: "Re-run Kalshi discovery first (recommended: the slate is only as fresh as the catalog)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      max_capture_age_minutes:
        description: "Older than this and EVERY contract is excluded as stale_quote"
        required: false
        default: "120"
      timezone:
        description: "Timezone the kickoff windows are defined in"
        required: false
        default: "America/New_York"

permissions:
  contents: read

concurrency:
  # A slate build is idempotent and writes nothing, so two of them racing
  # costs only minutes -- but a scheduled run overlapping a dispatched one
  # would produce two artifacts of the same name and the operator would
  # have no way to tell which they downloaded. The newer one wins, because
  # a slate is only as good as its quotes.
  group: cfb-execution-slate
  cancel-in-progress: true

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Collect the factual context
        # FAIL SOFT, ALWAYS. A source that 403s costs the domains it feeds,
        # for the games it would have fed, and nothing else: the collector
        # records those as `missing` WITH THE REASON and exits 0. The slate
        # then builds with a lower confidence ceiling and smaller handicap
        # batches, which is the honest outcome -- an unenriched game really
        # is more work to handicap.
        #
        # `continue-on-error` as well as the collector's own exit code,
        # because a crash here must not cost the slate either. A slate with
        # no context is the workflow as it behaved before enrichment
        # existed, and that was usable.
        continue-on-error: true
        run: |
          python3 scripts/collect_live_context.py \
            --catalog-dir data/live \
            --out-dir data/live/context \
            --horizon-days 2
      - name: Build the execution slate, shards and manifest
        run: |
          python3 -m cfb_edge_finder.execution prepare-live \
            --out-dir data/execution/latest \
            --context-dir data/live/context \
            --timezone "${{ github.event.inputs.timezone || 'America/New_York' }}" \
            --max-capture-age-minutes "${{ github.event.inputs.max_capture_age_minutes || '120' }}" \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.refresh != 'false' && '--refresh' || '' }}
      - name: Reconciliation summary
        # The job has already failed if the identity did not close --
        # prepare-live exits 2 on an unbalanced slate. This step exists so
        # the numbers are readable from the run page without downloading
        # the artifact.
        run: |
          python3 - <<'PY'
          import json
          slate = json.load(open("data/execution/latest/cfb_execution_slate.json"))
          manifest = json.load(open("data/execution/latest/shard_manifest.json"))
          r = slate["reconciliation"]
          print(f"discovered {r['contracts_discovered']} = eligible {r['contracts_eligible']} "
                f"+ excluded {r['contracts_excluded']}  (unaccounted {r['unaccounted_contracts']})")
          for status, count in r["exclusions_by_status"].items():
              print(f"  {status:32} {count}")
          print(f"shards reconcile: {manifest['reconciles']}")
          for entry in manifest["shards"]:
              print(f"  {entry['shard']:14} games={entry['game_count']:4} "
                    f"eligible={entry['contracts_eligible']:6} "
                    f"in_artifact={entry['contracts_in_analysis_artifact']:6} "
                    f"unaccounted={entry['unaccounted_contracts']} "
                    f"analysis={entry['analysis_bytes'] // 1000} KB")

          coverage = slate.get("factual_context_coverage") or {}
          enriched = coverage.get("games", 0) - coverage.get("games_with_no_context", 0)
          print(f"\nfactual context: {enriched} / {coverage.get('games', 0)} games enriched")
          for ceiling, count in (coverage.get("confidence_ceilings") or {}).items():
              print(f"  confidence ceiling {ceiling:14} {count}")

          batches = json.load(open("data/execution/latest/batch_manifest.json"))
          print(f"\nhandicap batches: {batches['totals']['batches']} "
                f"covering {batches['totals']['games']} games "
                f"(reconciles {batches['reconciles']})")
          print(f"  context bytes total: {batches['totals']['context_bytes'] // 1000} KB")
          for entry in batches["batches"][:8]:
              print(f"  {entry['batch']:16} games={entry['games']:2} "
                    f"cost={entry['reasoning_cost']:5.2f} "
                    f"contracts_priced_later={entry['eligible_contracts']:5}")
          if len(batches["batches"]) > 8:
              print(f"  ... and {len(batches['batches']) - 8} more")
          PY
      - name: Upload the execution slate
        uses: actions/upload-artifact@v4
        with:
          name: cfb-execution-slate
          path: data/execution/latest
          retention-days: 7
      - name: Upload the handicap batches
        # THE PRIMARY DELIVERABLE. Five to eight games of factual context
        # per file and ZERO contract rows -- the reader handicaps the
        # games, the repository prices every ladder from the result. Tens
        # of KB per batch against hundreds for a window's full market.
        uses: actions/upload-artifact@v4
        with:
          name: cfb-handicap-batches
          path: |
            data/execution/latest/batches/*.context.json
            data/execution/latest/batch_manifest.json
          retention-days: 7
      - name: Upload the full-market analysis artifacts
        # The one-pass workflow's deliverable, still produced: one file per
        # kickoff window carrying every eligible contract with prices and
        # fees. Kept because it is the only artifact that proves the
        # eligible universe is intact, and because a reader who wants to
        # inspect a specific ladder needs somewhere to look.
        uses: actions/upload-artifact@v4
        with:
          name: cfb-analysis-artifacts
          path: data/execution/latest/shards/*.analysis.json
          retention-days: 7
