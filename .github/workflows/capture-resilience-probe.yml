name: Capture Resilience Probe (read-only)

# LIVE, READ-ONLY validation of the ESPN fresh-schedule fallback
# (mission section C: "verify live response shape before relying on
# fields"; section M: validate against real production conditions).
#
# Runs on a GitHub-hosted runner because the dev container's egress proxy
# 403s every ESPN host -- and because the hosts ESPN actually serves
# differ between CI and elsewhere, which is the whole reason this exists:
# a 2026-09-03 probe (run 33789268655) found site.api.espn.com answering
# 403 to runners, the host the settlement fallback depends on.
#
# Makes ZERO CFBD requests. Writes nothing to any branch: the durable
# football-state artifact is materialised into a temp dir with `git show`
# and the refreshed schedule state is thrown away. Shares NO concurrency
# group with the collector, so it can never queue against a capture.

# *** AUTOMATIC TRIGGER REMOVED -- QUIET HIBERNATION (2026-09-06) ***
# This probe used to run on every push to
# `claude/capture-resilience-espn-schedule`, the feature branch it was
# written on. That branch merged (PR #37) and is not pushed any more, so
# the trigger fires for nothing -- but it is still live config that would
# start firing red probe runs the moment anyone reused the branch name.
# A read-only diagnostic probe is something an operator runs when they are
# asking a question, never something that should surprise them with mail.
# Dispatch it manually; the probe itself is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate the ESPN schedule fallback against the live durable artifact
        run: python scripts/validate_espn_schedule_live.py --season 2026

  # END-TO-END DRY RUN of the REAL collector against the REAL live outage.
  # --no-push means it writes locally on the runner and pushes nothing, so
  # it cannot touch the corpus, the durable branch, or another run's work;
  # it therefore needs no concurrency group and can never queue against a
  # genuine capture. This is the mission's section-M proof that the whole
  # path -- quota gate, slow-lane resolution, ESPN fresh-schedule refresh,
  # per-game guard, operational classification, exit code -- behaves under
  # the exact conditions that were producing a red run every five minutes.
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Configure git identity (the durable store stages locally even with --no-push)
        run: |
          git config user.name "capture-resilience-dryrun"
          git config user.email "capture-resilience-dryrun@users.noreply.github.com"
      - name: Scan and capture -- DRY RUN, writes locally, pushes nothing
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          # The exit code is DELIBERATELY not the pass/fail signal here.
          # A first entry into a degraded state is supposed to exit 1 (the
          # entry alert), and this runner has no durable operational state
          # to suppress against, so it always looks like a first entry.
          # What this job proves is the SEMANTICS: that captures land, on
          # the ESPN fresh schedule, with zero metered CFBD calls.
          set +e
          python scripts/research_scan_and_capture.py \
            --schedule-season 2026 \
            --run-id "dryrun-${{ github.run_id }}" \
            --trigger-type workflow_dispatch \
            --trigger-actor "${{ github.actor }}" \
            --trigger-source MANUAL \
            --no-push > "$RUNNER_TEMP/dryrun.log" 2>&1
          echo "collector exit code: $?"
          set -e
          tail -60 "$RUNNER_TEMP/dryrun.log"
          python - "$RUNNER_TEMP/dryrun.log" <<'PY'
          import json, re, sys

          text = open(sys.argv[1]).read()
          perf = json.loads(re.search(r"^PERF (\{.*\})$", text, re.M).group(1))
          checks = {
              "zero metered CFBD calls while the quota is exhausted": perf["cfbd_requests"] == 0,
              "slow model half served from the durable CFBD artifact": perf["football_state_source"]
              in ("cache", "cache_cfbd_gated", "cache_schedule_fallback", "cache_after_refresh_failure"),
              "fresh schedule facts obtained": perf["schedule_games_refreshed"] > 0,
              "run was classified, not left unclassified": perf["operational_state"] != "not_classified",
              "no deadline was left at risk": perf["deadline_risk_games"] == 0
              or perf["operational_state"] == "DEADLINE_AT_RISK",
          }
          # Captures only land when something is genuinely due; a quiet
          # window is a legitimate outcome, so this is reported, not asserted.
          print(json.dumps({
              "captures_written": perf["observation_count"],
              "schedule_provider": perf["schedule_provider"],
              "schedule_games_refreshed": perf["schedule_games_refreshed"],
              "football_state_source": perf["football_state_source"],
              "football_state_schedule_age_minutes": perf["football_state_schedule_age_minutes"],
              "operational_state": perf["operational_state"],
              "cfbd_requests": perf["cfbd_requests"],
          }, indent=1))
          for name, ok in checks.items():
              print(("PASS  " if ok else "FAIL  ") + name)
          sys.exit(0 if all(checks.values()) else 1)
          PY
